name: unit tests

on:
  push:
    branches: 
      - 'trial/**'
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v5

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # .NET 11 is still in RC, so it needs the preview quality
      - name: Setup .NET SDK 11 (RC)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Run tests (they start SQL Server and PostgreSQL in containers by themselves)
      # Two target frameworks at a time, since starting four SQL Server containers at once can time out on the runner
      - name: Run tests
        working-directory: EFCore.IndexAttribute.Test
        run: dotnet test --output detailed --max-parallel-test-modules 2
